<!DOCTYPE html>
<html lang="vi">
<head>

    <title>CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <h1>CSS Transitions & Animations</h1>

    <section class="demo-list fade-in">

            <div class="image-box">

            </div>
            <h2>Sản phẩm demo</h2>

        </article>

        <div class="spinner-box">

        </div>
    </section>
