<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Đoán Số</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px;
            color: #111827;
        }

        .box {
            max-width: 720px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        #result {
            margin-top: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Mini Game Đoán Số</h1>
        <p>Game sử dụng prompt() và alert() để nhập số và thông báo kết quả.</p>
        <div id="result">Game sẽ bắt đầu khi trang được mở.</div>
    </div>

    <script src="guess.js"></script>
</body>
</html>
