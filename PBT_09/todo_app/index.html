<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBT 09 - Todo App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="app">
        <section class="todo-card">
            <div class="header">
                <p class="label">PBT_09 - Bài B1</p>
                <h1>Todo App</h1>
                <p>Quản lý công việc bằng DOM Manipulation</p>
            </div>

            <form id="todoForm" class="todo-form">
                <input id="todoInput" type="text" placeholder="Nhập việc cần làm..." autocomplete="off">
                <button type="submit">Thêm</button>
            </form>

            <div class="toolbar">
                <div class="filters" aria-label="Todo filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button id="clearCompleted" class="clear-btn">Clear completed</button>
            </div>

            <ul id="todoList" class="todo-list" aria-label="Todo list"></ul>

            <footer class="footer">
                <span id="countText">0 items left</span>
                <span>Double-click để sửa todo</span>
            </footer>
        </section>
    </main>
</body>
</html>
