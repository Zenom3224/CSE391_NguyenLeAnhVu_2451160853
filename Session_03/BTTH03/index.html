<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K66 - BTTH03 - HTML CSS JS DOM</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eeeeee;
      color: #111111;
    }

    .container {
      width: 850px;
      max-width: 96%;
      margin: 30px auto;
      background: white;
      border: 1px solid #999999;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
      border-bottom: 1px solid #999999;
      padding-bottom: 10px;
    }

    p {
      line-height: 1.5;
    }

    .cards {
      margin-top: 20px;
    }

    a.card {
      display: block;
      color: black;
      text-decoration: none;
      border: 1px solid #999999;
      background: #f7f7f7;
      padding: 15px;
      margin-bottom: 12px;
    }

    a.card:hover {
      background: #e9e9e9;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .card span {
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>K66 - BTTH03 - HTML, CSS, JavaScript DOM</h1>

    <section class="cards">
      <a class="card" href="./De1/index.html">
        <h2>Bài 1: Quản lý sinh viên</h2>
        <p>Bảng sinh viên, thêm, sửa, xóa, thống kê tổng số và điểm trung bình.</p>
        <span>Mở bài 1</span>
      </a>

      <a class="card" href="./De2/index.html">
        <h2>Bài 2: Quản lý công việc cá nhân</h2>
        <p>Danh sách công việc, thêm, sửa, xóa, đổi trạng thái hoàn thành và thống kê.</p>
        <span>Mở bài 2</span>
      </a>
    </section>
  </main>
</body>
</html>
