<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - Nguyễn Lê Anh Vũ</title>
    <style>
:root {
    --bg: #07111f;
    --panel: #0d1b2f;
    --panel-soft: #132541;
    --cyan: #22d3ee;
    --blue: #2563eb;
    --violet: #8b5cf6;
    --orange: #fb923c;
    --text: #e5f2ff;
    --muted: #9fb3c8;
    --line: rgba(148, 163, 184, .25);
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(34, 211, 238, .18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, .18), transparent 35%),
        var(--bg);
    color: var(--text);
    line-height: 1.6;
}
header {
    padding: 28px 8%;
    background: linear-gradient(135deg, rgba(37, 99, 235, .38), rgba(139, 92, 246, .25));
    border-bottom: 1px solid var(--line);
}
nav { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
nav a { color: var(--text); text-decoration: none; font-weight: 700; }
nav a:hover { color: var(--cyan); }
.logo { margin-right: auto; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
main { width: min(1120px, 92%); margin: 32px auto; }
.hero, .card, fieldset, section.panel {
    background: rgba(13, 27, 47, .82);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
}
.hero { padding: 32px; margin-bottom: 24px; }
h1, h2, h3 { line-height: 1.2; }
h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 52px); }
h2 { margin-top: 0; color: #f8fbff; }
.lead { color: var(--muted); max-width: 760px; }
.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.card, section.panel { padding: 22px; }
label { display: block; font-weight: 700; margin: 12px 0 6px; }
input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, .35);
    background: rgba(7, 17, 31, .9);
    color: var(--text);
    outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, .18); }
input:invalid:not(:placeholder-shown) { border-color: var(--danger); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
fieldset { margin: 20px 0; padding: 20px; }
legend { color: var(--cyan); font-weight: 800; padding: 0 8px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
button, .btn {
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color: white;
    text-decoration: none;
    display: inline-block;
}
button[type="reset"], .btn.secondary { background: var(--panel-soft); color: var(--text); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 14px; }
th, td { padding: 14px; border-bottom: 1px solid var(--line); text-align: left; }
th { background: rgba(37, 99, 235, .28); color: white; }
tfoot td { font-weight: 800; color: var(--cyan); }
.notice { padding: 14px 16px; border-radius: 14px; background: rgba(34, 211, 238, .1); border: 1px solid rgba(34, 211, 238, .28); color: var(--text); }
footer { text-align: center; padding: 26px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 44px; }
.figure-card figure { margin: 0; }
.figure-card img { width: 100%; height: auto; border-radius: 16px; display: block; background: #0f172a; }
figcaption { color: var(--muted); margin-top: 10px; }
.radio-line, .check-line { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.radio-line input, .check-line input { width: auto; }
.badge { display:inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(251,146,60,.15); color: #fed7aa; font-size: 12px; font-weight: 800; }
@media (max-width: 640px) {
    header { padding: 22px 5%; }
    .logo { width: 100%; margin: 0 0 8px; }
    main { width: 94%; }
    .hero, .card, section.panel, fieldset { padding: 18px; }
    th, td { padding: 10px; font-size: 14px; }
}
</style>
</head>
